<style>
  :root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; overflow:hidden; background:#0d0f12;}
  body{ font-family:'JetBrains Mono',monospace; color:#e8e9eb;
    background:radial-gradient(ellipse at 50% 0%, #1c2027 0%, #0d0f12 65%); }
  #scene{width:100%; height:100%; display:block; touch-action:none; user-select:none;}
  .hud{position:fixed; left:20px; top:calc(20px + env(safe-area-inset-top,0px)); z-index:5;}
  .hud h1{font-size:15px; letter-spacing:.04em; margin:0; font-weight:700;}
  .grab{cursor:grab;} .grab.dragging{cursor:grabbing;}
</style>

<body>
<div class="hud"></div>
<svg id="scene" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"></svg>

<script>
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){
  const n=document.createElementNS(NS,tag);
  for(const k in attrs) n.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(n);
  return n;
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function randRange(min,max){ return min+Math.random()*(max-min); }
const svg=document.getElementById('scene');
const defs=el('defs',{},svg);
const rackGrad=el('linearGradient',{id:'rackGrad',x1:'0',y1:'0',x2:'0',y2:'1'},defs);
el('stop',{offset:'0%','stop-color':'#484e57'},rackGrad);
el('stop',{offset:'100%','stop-color':'#202226'},rackGrad);
const shredGrad=el('linearGradient',{id:'shredGrad',x1:'0',y1:'0',x2:'0',y2:'1'},defs);
el('stop',{offset:'0%','stop-color':'#3d4249'},shredGrad);
el('stop',{offset:'100%','stop-color':'#1c1f23'},shredGrad);

el('rect',{x:0,y:920,width:1000,height:80,fill:'#0a0c0e'},svg);
el('rect',{x:0,y:920,width:1000,height:2,fill:'#2a2e33'},svg);

const RX=220,RY=30,RW=480,RH=870;
el('rect',{x:RX,y:RY,width:RW,height:RH,rx:14,fill:'url(#rackGrad)',stroke:'#111','stroke-width':3},svg);
el('rect',{x:RX,y:RY,width:RW,height:26,fill:'#15171a',rx:8},svg);

[RX+16, RX+RW-34].forEach(rx=>{
  el('rect',{x:rx,y:RY+30,width:18,height:RH-40,fill:'#17191c'},svg);
  for(let y=RY+42;y<RY+RH-20;y+=22) el('rect',{x:rx+6,y,width:6,height:10,rx:1,fill:'#050607'},svg);
});

const bayX=RX+44, bayW=RW-88;
const decorLayer=el('g',{},svg);
const cablesLayer=el('g',{},svg);
const plugsLayer=el('g',{},svg);

function drawSocket(g,x,y){
  el('rect',{x:x+6,y:y-3,width:5,height:3,fill:'#0b0c0d'},g);
  const r=el('rect',{x,y,width:16,height:14,rx:2,fill:'#0b0c0d',stroke:'#000','stroke-width':1,class:'grab'},g);
  el('rect',{x:x+3,y:y+3,width:10,height:8,rx:1,fill:'#2a2d31'},g);
  el('rect',{x:x+5,y:y+4,width:6,height:6,fill:'#111417'},g);
  return r;
}
function pointsHex(cx,cy,r){
  const pts=[];
  for(let a=0;a<6;a++){ const ang=Math.PI/3*a-Math.PI/6; pts.push((cx+r*Math.cos(ang)).toFixed(1)+','+(cy+r*Math.sin(ang)).toFixed(1)); }
  return pts.join(' ');
}
function bayDellSlim(g,x,y,w,h){
  const n=4,gap=2, by=y+12, bh=h-16, bw=(w-(n-1)*gap)/n;
  for(let px=x;px<x+w;px+=5) el('circle',{cx:px,cy:y+6,r:0.7,fill:'#111',opacity:.5},g);
  for(let b=0;b<n;b++){
    const bx=x+b*(bw+gap);
    el('rect',{x:bx,y:by,width:bw,height:bh,rx:1.5,fill:'#1c1e21',stroke:'#000','stroke-width':1},g);
    el('circle',{cx:bx+bw/2,cy:by+bh/2,r:4,fill:'none',stroke:'#ffb020','stroke-width':1.4},g);
    el('circle',{cx:bx+bw/2,cy:by+bh/2,r:1.3,fill:'#ffb020'},g);
    el('circle',{cx:bx+4,cy:by+4,r:1.3,fill:'#4ade80'},g);
  }
}
function bayLenovoGrid(g,x,y,w,h){
  const cols=6,rows=2,gap=1.2, topY=y+11, cw=(w-(cols-1)*gap)/cols, ch=(h-16-(rows-1)*gap)/rows;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const bx=x+c*(cw+gap), by=topY+r*(ch+gap);
    el('rect',{x:bx,y:by,width:cw,height:ch,rx:1,fill:'#1a1c1e',stroke:'#000','stroke-width':.8},g);
    el('rect',{x:bx+cw/2-1,y:by+ch-3,width:2,height:2,fill:'#d6473c'},g);
    el('circle',{cx:bx+cw-2.5,cy:by+2.5,r:1,fill:'#4ade80'},g);
  }
}
function bayLenovoWide(g,x,y,w,h){
  const n=4,gap=2, by=y+12, bh=h-16, bw=(w-(n-1)*gap)/n;
  for(let b=0;b<n;b++){
    const bx=x+b*(bw+gap);
    el('rect',{x:bx,y:by,width:bw,height:bh,rx:1.5,fill:'#18191b',stroke:'#000','stroke-width':1},g);
    el('rect',{x:bx+2,y:by+2,width:3,height:3,fill:'#d6473c'},g);
    el('rect',{x:bx+bw-5,y:by+bh-5,width:3,height:3,fill:'#d6473c'},g);
    el('circle',{cx:bx+bw-5,cy:by+4,r:1.2,fill:'#4ade80'},g);
  }
  el('rect',{x:x+w/2-9,y:y+h/2-5,width:18,height:10,rx:1.5,fill:'#0c0e10',stroke:'#3a3f47'},g);
}
function bayDellHex(g,x,y,w,h){
  const by=y+11, bh=h-15, s=6;
  el('rect',{x,y:by,width:w,height:bh,rx:2,fill:'#141618',stroke:'#000'},g);
  let row=0;
  for(let hy=by+3;hy<by+bh-3;hy+=s*0.87,row++){
    const off=(row%2)*s/2;
    for(let hx=x+3;hx<x+w-3;hx+=s) el('polygon',{points:pointsHex(hx+off,hy,s*0.55),fill:'none',stroke:'#33383f','stroke-width':.6},g);
  }
  for(let i=0;i<3;i++) el('circle',{cx:x+8+i*(w-16)/2,cy:by+bh-5,r:1.3,fill:i===1?'#ffb020':'#4ade80'},g);
}
const bayDesigns=[bayDellSlim,bayLenovoGrid,bayLenovoWide,bayDellHex];

function serverUnit(x,y,w,h,idx){
  const g=el('g',{},decorLayer);
  el('rect',{x,y,width:w,height:h,rx:3,fill:'#26292e',stroke:'#111','stroke-width':1.2},g);
  el('rect',{x,y:y+2,width:3,height:h-4,fill:'#2d7dd2'},g);
  // power button (bezel + icon + status LED)
  el('rect',{x:x+10,y:y+h/2-8,width:16,height:16,rx:8,fill:'#1a1c1f',stroke:'#111','stroke-width':1.5},g);
  el('circle',{cx:x+18,cy:y+h/2+1,r:4,fill:'none',stroke:'#565c64','stroke-width':1.3},g);
  el('line',{x1:x+18,y1:y+h/2-5,x2:x+18,y2:y+h/2-1.5,stroke:'#565c64','stroke-width':1.3},g);
  const pwr=el('circle',{id:'pwr-'+idx,cx:x+18,cy:y+h/2-9,r:2.4,fill:'#3a3f47'},g);
  // two usb ports
  [0,1].forEach(u=>{
    el('rect',{x:x+32,y:y+h/2-9+u*11,width:12,height:6,rx:1.2,fill:'#0b0c0d',stroke:'#3a3f47','stroke-width':1},g);
  });
  // randomly chosen drive-bay design, styled after the reference photos
  const rx0=x+52, rx1=x+w-92;
  el('text',{x:rx0,y:y+9,'font-size':7,fill:'#565c64','letter-spacing':1.2},g);
  bayDesigns[Math.floor(Math.random()*bayDesigns.length)](g,rx0,y,rx1-rx0,h);
  const sockets=[];
  for(let s=0;s<2;s++){
    const sx=x+w-58+s*32, sy=y+h/2-7;
    const sockEl=drawSocket(g,sx,sy);
    sockets.push({x:sx+8,y:sy+13,el:sockEl});
  }
  return {pwr,sockets};
}
function ventBox(x,y,w,h,label){
  const g=el('g',{},decorLayer);
  el('rect',{x,y,width:w,height:h,rx:3,fill:'#2c2f34',stroke:'#111','stroke-width':1.2},g);
  for(let vx=x+10;vx<x+w-10;vx+=6) el('line',{x1:vx,y1:y+h*0.3,x2:vx,y2:y+h*0.7,stroke:'#111','stroke-width':1.4,opacity:0.6},g);
  el('circle',{cx:x+w-16,cy:y+h/2,r:3,fill:'#4ade80'},g);
  el('circle',{cx:x+w-28,cy:y+h/2,r:3,fill:'#ffb020'},g);
  if(label) el('text',{x:x+10,y:y+h/2+4,'font-size':9,fill:'#6a7078','letter-spacing':1.5},g).textContent=label;
}
function storageBox(x,y,w,h){
  const g=el('g',{},decorLayer);
  el('rect',{x,y,width:w,height:h,rx:3,fill:'#2b2e33',stroke:'#111','stroke-width':1.2},g);
  for(let i=0;i<3;i++){
    el('rect',{x:x+10,y:y+10+i*14,width:w-20,height:9,rx:2,fill:'#1a1c1f',stroke:'#0a0b0c'},g);
    el('circle',{cx:x+w-18,cy:y+14+i*14,r:2,fill:'#4ade80'},g);
  }
}
function upsBox(x,y,w,h){
  const g=el('g',{},decorLayer);
  el('rect',{x,y,width:w,height:h,rx:3,fill:'#232629',stroke:'#111','stroke-width':1.2},g);
  el('rect',{x:x+10,y:y+10,width:70,height:22,rx:2,fill:'#0d3f2a',stroke:'#000'},g);
  el('text',{x:x+45,y:y+25,'font-size':10,fill:'#4ade80','text-anchor':'middle'},g).textContent = "98.6%";
  el('text',{x:x+w-14,y:y+h-10,'font-size':9,fill:'#6a7078','text-anchor':'end','letter-spacing':1.5},g).textContent = "made by sirkingbinx";
}
function pduBox(x,y,w,h){
  const g=el('g',{},decorLayer);
  el('rect',{x,y,width:w,height:h,rx:3,fill:'#1e2023',stroke:'#111','stroke-width':1.2},g);
  for(let i=0;i<6;i++) el('circle',{cx:x+16+i*(w-32)/5,cy:y+h/2,r:5,fill:'#111',stroke:'#3a3f47'},g);
  el('text',{x:x+w-10,y:y+h/2+4,'font-size':9,fill:'#6a7078','text-anchor':'end','letter-spacing':1.5},g);
}
function switchBox(x,y,w,h){
  const g=el('g',{},decorLayer);
  el('rect',{x,y,width:w,height:h,rx:3,fill:'#26292e',stroke:'#111','stroke-width':1.2},g);
  el('text',{x:x+10,y:y+12,'font-size':8.5,fill:'#6a7078','letter-spacing':1.5},g);
  const n=8;
  for(let i=0;i<n;i++){
    const px=x+14+i*((w-28)/(n-1));
    el('rect',{x:px-6,y:y+h-16,width:12,height:9,rx:1,fill:'#0e1012',stroke:'#000'},g);
    el('circle',{cx:px,cy:y+h-20,r:2,fill:i%3===0?'#ef4444':'#4ade80'},g);
  }
}

let cy=RY+40;
const patchY=cy, patchH=46; cy+=patchH+8;
switchBox(bayX,cy,bayW,32); cy+=32+8;
const serverInfo=[];
for(let i=0;i<6;i++){ serverInfo.push(serverUnit(bayX,cy,bayW,44,i)); cy+=44+5; }
ventBox(bayX,cy,bayW,32, ''); cy+=32+8;
storageBox(bayX,cy,bayW,58); cy+=58+8;
upsBox(bayX,cy,bayW,64); cy+=64+8;
pduBox(bayX,cy,bayW,30);
 
el('rect',{x:bayX,y:patchY,width:bayW,height:patchH,rx:3,fill:'#1b1d20',stroke:'#111','stroke-width':1.2},decorLayer);
el('text',{x:bayX+10,y:patchY+12,'font-size':8.5,fill:'#6a7078','letter-spacing':1.5},decorLayer);

const N=12;
const colors=['#2d7dd2','#e2b93b','#3fae5c','#d6473c','#9099a3','#8b6fd6','#2d7dd2','#e2b93b','#3fae5c','#d6473c','#8b6fd6','#3fae5c'];
function slotX(s){ return bayX+18 + s*((bayW-36)/(N-1)); }
const portSlots=shuffle([...Array(N).keys()]);
const portXs=portSlots.map(s=>slotX(s)+randRange(-7,7));
const portY=patchY+22;
for(let i=0;i<N;i++){
  el('rect',{x:portXs[i]-10,y:portY,width:20,height:16,rx:2,fill:'#0e1012',stroke:'#000','stroke-width':1.2},decorLayer);
  el('circle',{id:'led-'+i,cx:portXs[i],cy:portY-6,r:3.5,fill:'#4ade80'},decorLayer);
}

const shredCX=890, shredCY=888, shredR=72;
{
  const g=el('g',{},svg);
  el('rect',{x:800,y:830,width:180,height:120,rx:10,fill:'url(#shredGrad)',stroke:'#111','stroke-width':3},g);
  el('rect',{x:816,y:850,width:148,height:12,rx:4,fill:'#0b0c0d'},g);
  for(let i=0;i<8;i++) el('line',{x1:824+i*18,y1:852,x2:824+i*18,y2:860,stroke:'#000','stroke-width':2},g);
  el('rect',{x:816,y:882,width:148,height:54,rx:6,fill:'#141618',stroke:'#000'},g);
  el('text',{x:890,y:964,'font-size':10,fill:'#6a7078','text-anchor':'middle','letter-spacing':2},g);
}
const shredHi=el('rect',{x:800,y:830,width:180,height:120,rx:10,fill:'none',stroke:'#ffb020','stroke-width':0},svg);
const bitsLayer=el('g',{},svg);

function bundle(x0,y0,pts,c1,c2){
  let d=`M ${x0} ${y0}`; pts.forEach(p=>{ d+=` L ${p[0]} ${p[1]}`; });
  const p1=el('path',{d,fill:'none',stroke:c1,'stroke-width':13,'stroke-linecap':'round','stroke-linejoin':'round',opacity:0.95},decorLayer);
  el('path',{d,fill:'none',stroke:c2,'stroke-width':4,'stroke-linecap':'round','stroke-linejoin':'round',opacity:0.5},decorLayer);
  const len=p1.getTotalLength();
  for(let l=20;l<len-10;l+=70){
    const pt=p1.getPointAtLength(l);
    el('rect',{x:pt.x-3,y:pt.y-7,width:6,height:14,rx:2,fill:'#0a0b0c',opacity:0.85,transform:`rotate(90 ${pt.x} ${pt.y})`},decorLayer);
  }
}
bundle(RX+8,120,[[RX-14,160],[RX-14,600],[RX+30,860]],'#182236','#2e4a7a');
bundle(RX+RW-8,120,[[RX+RW+14,160],[RX+RW+14,600],[RX+RW-30,860]],'#1e1a12','#7a5a2e');

// --- Cat6e pull box ---
const boxX=40, boxY=760, boxW=150, boxH=180;
const boxLayer=el('g',{},svg);
el('rect',{x:boxX,y:boxY,width:boxW,height:boxH,rx:4,fill:'#1b2a52',stroke:'#0a1330','stroke-width':2},boxLayer);
el('rect',{x:boxX+10,y:boxY+12,width:46,height:20,rx:2,fill:'#f2f2f0',stroke:'#0a1330'},boxLayer);
el('text',{x:boxX+33,y:boxY+26,'font-size':8,fill:'#1b2a52','text-anchor':'middle','font-weight':700},boxLayer).textContent='NETWORX';
el('polygon',{points:`${boxX+boxW-24},${boxY+10} ${boxX+boxW-16},${boxY+24} ${boxX+boxW-32},${boxY+24}`,fill:'#ffb020'},boxLayer);
el('text',{x:boxX+boxW-24,y:boxY+34,'font-size':7,fill:'#ffb020','text-anchor':'middle','font-weight':700},boxLayer).textContent='UP';
el('text',{x:boxX+boxW/2,y:boxY+76,'font-size':26,fill:'#ffb020','text-anchor':'middle','font-style':'italic','font-weight':800},boxLayer).textContent='Cat6e';
el('path',{d:`M ${boxX+20} ${boxY+boxH} Q ${boxX+20} ${boxY+boxH-70} ${boxX+boxW/2} ${boxY+boxH-70} Q ${boxX+boxW-20} ${boxY+boxH-70} ${boxX+boxW-20} ${boxY+boxH} Z`,fill:'#f2f2f0'},boxLayer);
el('rect',{x:boxX+14,y:boxY+boxH-28,width:boxW-28,height:22,rx:2,fill:'#f2f2f0',stroke:'#0a1330','stroke-width':1},boxLayer);
el('text',{x:boxX+boxW/2,y:boxY+boxH-14,'font-size':7.5,fill:'#1b2a52','text-anchor':'middle','font-weight':700},boxLayer).textContent='CAT6E 600MHz';
const boxAnchor={x:boxX+boxW/2-8,y:boxY+boxH-52};
el('path',{d:`M ${boxAnchor.x} ${boxAnchor.y} l 14 -20`,stroke:'#2d7dd2','stroke-width':6,'stroke-linecap':'round',fill:'none'},boxLayer);
const stub=el('circle',{cx:boxAnchor.x+14,cy:boxAnchor.y-20,r:8,fill:'#2d7dd2',opacity:0,class:'grab'},boxLayer);
const stubTip={x:boxAnchor.x+14,y:boxAnchor.y-20};

svg.appendChild(cablesLayer);
svg.appendChild(plugsLayer);

function sag(x1,y1,x2,y2,amt){ const mx=(x1+x2)/2, my=(y1+y2)/2+amt; return `M ${x1} ${y1} Q ${mx} ${my} ${x2} ${y2}`; }
function toSvgPoint(e){ const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }

const docks=[]; serverInfo.forEach((s,si)=>s.sockets.forEach(sk=>docks.push({...sk,serverIdx:si})));
const dockOrder=shuffle([...Array(N).keys()]);
let cables=[];
let offX=0, offY=0;

for(let i=0;i<N;i++){
  const anchor={x:portXs[i],y:portY+16};
  const dock=docks[dockOrder[i]];
  const hit=el('path',{d:'',fill:'none',stroke:'#000','stroke-width':22,opacity:0,class:'grab'},cablesLayer);
  const path=el('path',{d:'',fill:'none',stroke:colors[i],'stroke-width':5,'stroke-linecap':'round'},cablesLayer);
  const plug=el('g',{class:'grab'},plugsLayer);
  // slim RJ45 plug: cable-colour boot, clear body, gold pins, clip tab
  el('rect',{x:8,y:1,width:10,height:10,rx:2.5,fill:colors[i]},plug);
  el('rect',{x:0,y:3,width:10,height:7,rx:1,fill:'#dfe4e8',stroke:'#9099a3','stroke-width':.7,opacity:.92},plug);
  el('polygon',{points:'3,3 7,3 5,-2',fill:'#c9ced3'},plug);
  for(let p=0;p<4;p++) el('line',{x1:1+p*2,y1:9.5,x2:1+p*2,y2:11,stroke:'#c9a24a','stroke-width':.8},plug);

  const c={i,serverIdx:Math.floor(dockOrder[i]/2),color:colors[i],anchor,dock,path,hit,plug,mode:null,freeX:dock.x,freeY:dock.y,bendX:dock.x,bendY:dock.y,destroyed:false};
  cables.push(c);
  render(c);

  [plug,hit].forEach(node=>node.addEventListener('pointerdown',e=>{
    if(node===hit) startBend(c,e); else startEnd(c,e);
  }));
  dock.el.addEventListener('pointerdown',e=>startEnd(c,e));
  [plug,hit,dock.el].forEach(node=>{
    node.addEventListener('pointermove',e=>onMove(c,e));
    node.addEventListener('pointerup',e=>endDrag(c,e));
    node.addEventListener('pointercancel',e=>endDrag(c,e));
  });
}
updateAllPower();

function startEnd(c,e){
  if(c.destroyed) return;
  const ox=c.dock?c.dock.x:c.anchor.x, oy=c.dock?c.dock.y:c.anchor.y;
  c.mode='end'; c.freeX=ox; c.freeY=oy;
  c.plug.classList.add('dragging'); plugsLayer.appendChild(c.plug);
  const p=toSvgPoint(e); offX=p.x-c.freeX; offY=p.y-c.freeY;
  try{c.plug.setPointerCapture(e.pointerId);}catch(err){}
  try{c.hit.setPointerCapture(e.pointerId);}catch(err){}
}
function startBend(c,e){
  if(c.destroyed) return;
  c.mode='bend';
  const p=toSvgPoint(e); c.bendX=p.x; c.bendY=p.y;
  try{c.hit.setPointerCapture(e.pointerId);}catch(err){}
}
function onMove(c,e){
  if(!c.mode) return;
  const p=toSvgPoint(e);
  if(c.mode==='end'){ c.freeX=p.x-offX; c.freeY=p.y-offY; }
  else { c.bendX=p.x; c.bendY=p.y; }
  render(c);
  const px=c.mode==='end'?c.freeX:c.bendX, py=c.mode==='end'?c.freeY:c.bendY;
  shredHi.setAttribute('stroke-width', Math.hypot(px-shredCX,py-shredCY)<shredR+50?4:0);
}
function nearestFreeDock(x,y,thresh){
  let best=null,bestD=thresh;
  docks.forEach(d=>{
    if(cables.some(c=>c.dock===d && !c.destroyed)) return;
    const dd=Math.hypot(x-d.x,y-d.y);
    if(dd<bestD){ bestD=dd; best=d; }
  });
  return best;
}
function wireDock(c){
  const node=c.dock.el;
  node.addEventListener('pointerdown',e=>startEnd(c,e));
  node.addEventListener('pointermove',e=>onMove(c,e));
  node.addEventListener('pointerup',e=>endDrag(c,e));
  node.addEventListener('pointercancel',e=>endDrag(c,e));
}
function retract(c){
  const sx=c.freeX,sy=c.freeY,start=performance.now(),dur=260;
  function step(t){ const k=Math.min(1,(t-start)/dur);
    c.freeX=sx+(c.anchor.x-sx)*k; c.freeY=sy+(c.anchor.y-sy)*k; render(c);
    c.plug.setAttribute('opacity',1-k);
    if(k<1) requestAnimationFrame(step); else { c.destroyed=true; c.plug.remove(); c.path.remove(); c.hit.remove(); } }
  requestAnimationFrame(step);
}
function endDrag(c,e){
  if(!c.mode) return;
  const px=c.mode==='end'?c.freeX:c.bendX, py=c.mode==='end'?c.freeY:c.bendY;
  shredHi.setAttribute('stroke-width',0);
  c.plug.classList.remove('dragging');
  if(Math.hypot(px-shredCX,py-shredCY)<shredR){
    if(c.mode==='bend'){ c.freeX=c.bendX; c.freeY=c.bendY; c.mode='end'; }
    destroy(c);
    return;
  }
  if(!c.dock){
    const target=nearestFreeDock(px,py,42);
    if(target){ c.dock=target; c.serverIdx=target.serverIdx; wireDock(c); c.mode=null; render(c); updateAllPower(); }
    else { retract(c); }
    return;
  }
  if(c.mode==='end'){ snapEnd(c); } else { snapBend(c); }
}
function spawnFromBox(e){
  const path=el('path',{d:'',fill:'none',stroke:'#000','stroke-width':22,opacity:0,class:'grab'},cablesLayer);
  const cable=el('path',{d:'',fill:'none',stroke:'#2d7dd2','stroke-width':5,'stroke-linecap':'round'},cablesLayer);
  const plug=el('g',{class:'grab'},plugsLayer);
  el('rect',{x:8,y:1,width:10,height:10,rx:2.5,fill:'#2d7dd2'},plug);
  el('rect',{x:0,y:3,width:10,height:7,rx:1,fill:'#dfe4e8',stroke:'#9099a3','stroke-width':.7,opacity:.92},plug);
  el('polygon',{points:'3,3 7,3 5,-2',fill:'#c9ced3'},plug);
  for(let p=0;p<4;p++) el('line',{x1:1+p*2,y1:9.5,x2:1+p*2,y2:11,stroke:'#c9a24a','stroke-width':.8},plug);
  const c={i:-1,serverIdx:-1,color:'#2d7dd2',anchor:stubTip,dock:null,path:cable,hit:path,plug,mode:null,freeX:stubTip.x,freeY:stubTip.y,bendX:stubTip.x,bendY:stubTip.y,destroyed:false};
  cables.push(c);
  [plug,path].forEach(node=>{
    node.addEventListener('pointermove',e2=>onMove(c,e2));
    node.addEventListener('pointerup',e2=>endDrag(c,e2));
    node.addEventListener('pointercancel',e2=>endDrag(c,e2));
  });
  startEnd(c,e);
}
stub.addEventListener('pointerdown', spawnFromBox);
function render(c){
  if(c.destroyed) return;
  if(c.mode==='bend'){
    const cx1=(c.anchor.x+c.bendX)/2, cy1=(c.anchor.y+c.bendY)/2;
    const cx2=(c.bendX+c.dock.x)/2, cy2=(c.bendY+c.dock.y)/2;
    const d=`M ${c.anchor.x} ${c.anchor.y} Q ${cx1} ${cy1} ${c.bendX} ${c.bendY} Q ${cx2} ${cy2} ${c.dock.x} ${c.dock.y}`;
    c.path.setAttribute('d',d); c.hit.setAttribute('d',d);
  } else if(c.mode==='end'){
    const by=(c.anchor.y+c.freeY)/2+40;
    const d=`M ${c.anchor.x} ${c.anchor.y} Q ${(c.anchor.x+c.freeX)/2} ${by} ${c.freeX} ${c.freeY}`;
    c.path.setAttribute('d',d); c.hit.setAttribute('d',d);
    c.plug.setAttribute('transform',`translate(${c.freeX-9},${c.freeY-5})`);
  } else {
    const d=sag(c.anchor.x,c.anchor.y,c.dock.x,c.dock.y,26);
    c.path.setAttribute('d',d); c.hit.setAttribute('d',d);
    c.plug.setAttribute('transform',`translate(${c.dock.x-9},${c.dock.y-5})`);
  }
}
function snapEnd(c){
  const sx=c.freeX,sy=c.freeY,ex=c.dock.x,ey=c.dock.y,start=performance.now(),dur=340;
  function step(t){ const k=Math.min(1,(t-start)/dur), ease=1-Math.pow(1-k,3);
    c.freeX=sx+(ex-sx)*ease; c.freeY=sy+(ey-sy)*ease; render(c);
    if(k<1) requestAnimationFrame(step); else { c.mode=null; render(c); } }
  requestAnimationFrame(step);
}
function snapBend(c){
  const mx=(c.anchor.x+c.dock.x)/2, my=(c.anchor.y+c.dock.y)/2+26;
  const sx=c.bendX,sy=c.bendY,start=performance.now(),dur=280;
  function step(t){ const k=Math.min(1,(t-start)/dur), ease=1-Math.pow(1-k,3);
    c.bendX=sx+(mx-sx)*ease; c.bendY=sy+(my-sy)*ease; render(c);
    if(k<1) requestAnimationFrame(step); else { c.mode=null; render(c); } }
  requestAnimationFrame(step);
}
function destroy(c){
  c.destroyed=true;
  const led=document.getElementById('led-'+c.i); if(led) led.setAttribute('fill','#ef4444');
  const sx=c.freeX,sy=c.freeY,ex=shredCX,ey=845,start=performance.now(),dur=220;
  function step(t){ const k=Math.min(1,(t-start)/dur);
    c.freeX=sx+(ex-sx)*k; c.freeY=sy+(ey-sy)*k;
    c.mode='end'; render(c);
    c.plug.setAttribute('opacity',1-k*0.3);
    if(k<1) requestAnimationFrame(step); else finish(c); }
  requestAnimationFrame(step);
}
function finish(c){ c.plug.remove(); c.path.remove(); c.hit.remove(); spawnBits(c.color); if(c.serverIdx>=0) updateAllPower(); }
function spawnBits(color){
  for(let n=0;n<9;n++){
    const w=3+Math.random()*3,h=10+Math.random()*10,sx=shredCX-80+Math.random()*160,sy=890;
    const bit=el('rect',{x:sx,y:sy,width:w,height:h,rx:1,fill:color,opacity:0.9},bitsLayer);
    const fall=60+Math.random()*70, drift=(Math.random()-0.5)*40, rot=(Math.random()-0.5)*180;
    const start=performance.now(),dur=500+Math.random()*300;
    function step(t){ const k=Math.min(1,(t-start)/dur);
      bit.setAttribute('transform',`translate(${drift*k},${fall*k}) rotate(${rot*k} ${sx+w/2} ${sy+h/2})`);
      bit.setAttribute('opacity',String(0.9*(1-k)));
      if(k<1) requestAnimationFrame(step); else bit.remove(); }
    requestAnimationFrame(step);
  }
}
function updateAllPower(){
  serverInfo.forEach((s,idx)=>{
    const alive=cables.some(c=>c.serverIdx===idx && !c.destroyed);
    s.pwr.setAttribute('fill', alive?'#fff':'#3a3f47');
  });
}
</script>
